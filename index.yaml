  kafka-cluster:
  - annotations:
      category: Streaming
      licenses: Apache-2.0
    apiVersion: v2
    appVersion: 1.1.0
    created: "2026-07-30T10:17:07.588372393Z"
    dependencies:
    - alias: operator
      condition: operator.enabled
      name: strimzi-kafka-operator
      repository: https://strimzi.io/charts/
      version: 1.1.0
    description: Umbrella Helm chart that stands up a complete, production-oriented
      Apache Kafka platform on Strimzi. It (optionally) installs the Strimzi Cluster
      Operator and its CRDs as a subchart, then creates a KRaft (ZooKeeper-less) Kafka
      cluster with SEPARATE Broker and Controller KafkaNodePools, plus KafkaTopics,
      KafkaUsers and per-user ACLs - all driven from values so the same chart can
      be reused verbatim across multiple projects.
    digest: 135e87d35a97fb75f42bf1fbdc4e62a1043f4f582c7162a096543d2588ad33fe
    home: https://strimzi.io
