    description: Production-grade Helm chart that deploys a Milvus 2.6 cluster through
      the Milvus Operator by creating a milvus.io/v1beta1 Milvus custom resource.
      This chart connects Milvus exclusively to pre-existing EXTERNAL Kafka, etcd
      and Apache Ozone (S3 Gateway) dependencies. It never installs, manages or deletes
      those external systems.
