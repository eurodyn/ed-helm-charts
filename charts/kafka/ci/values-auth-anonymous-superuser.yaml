# CI: anonymous listener kept usable ALONGSIDE the simple ACL authorizer, via
# the User:ANONYMOUS superuser exemption. Covers the branch of the chart's
# anonymous-listener validation that must PASS.
operator:
  enabled: false
strictCRDCheck: false
cluster:
  name: kafka-anon-su
  listeners:
    # Anonymous listener (no authentication key).
    - name: plain
      port: 9092
      type: internal
      tls: false
    # A second, authenticated listener whose ACLs are still enforced.
    - name: secure
      port: 9093
      type: internal
      tls: true
      authentication:
        type: scram-sha-512
  authorization:
    type: simple
    superUsers:
      - User:ANONYMOUS
  config:
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
nodePools:
  controller:
    replicas: 1
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: true
    template: {}
  broker:
    replicas: 1
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: true
    template: {}
topics:
  - name: demo
    partitions: 1
    replicas: 1
users:
  - name: secure-client
    authentication:
      type: scram-sha-512
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: demo, patternType: literal }
          operations: [Read, Write, Describe]
          host: "*"
