# CI: mTLS listener + mTLS KafkaUser (cert CN = identity) + CN= superuser form.
operator:
  enabled: false
strictCRDCheck: false
cluster:
  name: kafka-mtls
  listeners:
    - name: internal
      port: 9092
      type: internal
      tls: true
      authentication:
        type: tls
  authorization:
    type: simple
    superUsers:
      - CN=ci-admin
  config:
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
nodePools:
  controller:
    replicas: 1
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: true
    template: {}
  broker:
    replicas: 1
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: true
    template: {}
topics:
  - name: demo
    partitions: 1
    replicas: 1
users:
  - name: mtls-client
    authentication:
      type: tls
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: demo, patternType: literal }
          operations: [Read, Write, Describe]
          host: "*"
        - resource: { type: group, name: demo-group, patternType: literal }
          operations: [Read]
          host: "*"
