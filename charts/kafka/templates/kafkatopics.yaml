{{- /* One KafkaTopic per .Values.topics entry. Reconciled by the Topic Operator. */ -}}
{{- range $i, $t := .Values.topics }}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: {{ $t.name }}
  namespace: {{ $.Release.Namespace }}
  labels:
    strimzi.io/cluster: {{ include "kafka-cluster.clusterName" $ }}
    {{- include "kafka-cluster.labels" $ | nindent 4 }}
    app.kubernetes.io/component: topic
spec:
  {{- with $t.topicName }}
  topicName: {{ . }}
  {{- end }}
  partitions: {{ int $t.partitions }}
  replicas: {{ int $t.replicas }}
  {{- with $t.config }}
  config:
    {{- include "kafka-cluster.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
{{- end }}
