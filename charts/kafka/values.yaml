# =============================================================================
# kafka-cluster — default values
# =============================================================================
# This umbrella chart:
#   1. (optionally) installs the Strimzi Cluster Operator + CRDs (subchart), then
#   2. creates a KRaft Kafka cluster from these values:
#        - a dedicated CONTROLLER KafkaNodePool  (quorum, metadata plane)
#        - a dedicated BROKER     KafkaNodePool  (data plane, JBOD storage)
#        - a Kafka CR             (listeners, auth, authorization, broker config)
#        - N KafkaTopics          (.Values.topics)
#        - N KafkaUsers + ACLs    (.Values.users)
#
# DESIGN: most nested blocks (storage, resources, jvmOptions, template, listeners,
# config, acls, ...) are passed through to the Strimzi CRDs VERBATIM. You can set
# any field the Strimzi v1 schema accepts without editing the chart. Values
# may contain Helm template expressions (rendered with `tpl`).
# =============================================================================

# -- Override the chart name portion of resource names. Cosmetic. Not required.
nameOverride: ""
# -- Override the full resource name. Also the DEFAULT Kafka cluster name (unless
#    cluster.name is set). Changing it after install creates a NEW, empty cluster
#    and orphans the old one — treat as immutable once data exists. Not required.
fullnameOverride: ""

# -- Extra labels applied to every object this chart creates (merged, tpl-rendered).
extraLabels: {}
# -- Extra annotations applied to the Kafka CR (merged, tpl-rendered).
extraAnnotations: {}

# -- The Strimzi CRD API version this chart's Kafka/KafkaNodePool/KafkaTopic/
#    KafkaUser resources are rendered as. Must match a version actually served
#    by the Strimzi operator installed in the target cluster:
#      - Strimzi >= ~0.45 (KRaft-only, this chart's default): "v1"
#      - older Strimzi releases: "v1beta2"
#    Check with: kubectl get crd kafkas.kafka.strimzi.io -o jsonpath='{.spec.versions[*].name}'
crdApiVersion: v1

# -- When true, the render fails hard if the kafka.strimzi.io/<crdApiVersion> CRDs
#    are not present in the cluster. Leave false when operator.enabled=true (the
#    subchart installs the CRDs in the same release). Set true for split installs.
strictCRDCheck: false

# =============================================================================
# Strimzi Cluster Operator (subchart: strimzi-kafka-operator, aliased "operator")
# =============================================================================
# Everything under `operator:` is passed to the Strimzi chart. `operator.enabled`
# additionally toggles whether the subchart is installed at all.
#   * true  -> this release installs the operator + CRDs (single-tenant / first project)
#   * false -> reuse an already-installed, cluster-scoped operator (multi-project)
operator:
  # -- Install the Strimzi Cluster Operator (and its CRDs) as part of this release.
  enabled: true
  # -- Watch every namespace. Set true for one shared operator serving many teams.
  watchAnyNamespace: false
  # -- Explicit list of namespaces to watch (leave empty to watch the release
  #    namespace only). Ignored when watchAnyNamespace=true.
  watchNamespaces: []
  # -- Operator log level: DEBUG | INFO | WARN | ERROR.
  logLevel: INFO
  # -- Operator pod resource requests/limits (Strimzi chart schema).
  resources:
    requests:
      cpu: 200m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 768Mi
  # Any other strimzi-kafka-operator values may be added here, e.g.:
  # featureGates: ""
  # defaultImageRegistry: quay.io

# =============================================================================
# Kafka cluster (Kafka CR)
# =============================================================================
cluster:
  # -- Kafka cluster name = Kafka CR metadata.name and the `strimzi.io/cluster`
  #    label on every pool/topic/user. Defaults to the chart fullname. Keep it
  #    short (<= ~40 chars) so generated pod names stay under the 63-char limit.
  name: ""

  # -- Kafka (broker) version. Must be a version the operator supports. Empty =
  #    let the operator pick its default. Strimzi 1.1.0 default is 4.3.0.
  version: "4.3.0"
  # -- KRaft metadata version. Upgrade this AFTER rolling `version` (two-step
  #    upgrade). Empty = operator default. For Kafka 4.3.0 use 4.3-IV0.
  metadataVersion: "4.3-IV0"

  # -- Add the `strimzi.io/node-pools: enabled` annotation. Harmless/ignored on
  #    Strimzi 1.x (node pools are mandatory); keep true for older operators.
  nodePoolsAnnotation: true

  # -- Listeners (pass-through list -> Kafka.spec.kafka.listeners). A Strimzi
  #    listener supports exactly ONE authentication type, so mTLS and SCRAM live
  #    on separate listeners here. Ports must be unique and >= 9092.
  listeners:
    # -- Default listener: PLAINTEXT, no authentication. TEMPORARY — this is
    #    open access (fine with the default cluster.authorization: {}, since no
    #    ACL authorizer is active). Replace with one of the mTLS/SCRAM examples
    #    below before using this outside local/dev.
    - name: plain
      port: 9092
      type: internal
      tls: false
    ## Internal listener: TLS-encrypted + mutual-TLS auth (client cert = identity).
    # - name: internal
    #   port: 9092
    #   type: internal
    #   tls: true
    #   authentication:
    #     type: tls
    ## External listener: TLS-encrypted + SCRAM-SHA-512 auth.
    # - name: external
    #   port: 9093
    #   type: internal
    #   tls: true
    #   authentication:
    #     type: scram-sha-512
    ## Anonymous (no-auth) listener — omit `authentication` entirely. If you
    ## enable this ALONGSIDE cluster.authorization.type: simple, also add
    ## "User:ANONYMOUS" to cluster.authorization.superUsers — otherwise
    ## anonymous clients connect but every request is denied by the ACL
    ## authorizer (see chart validation).
    # - name: anonymous
    #   port: 9094
    #   type: internal
    #   tls: false

  # -- Authorization (pass-through -> Kafka.spec.kafka.authorization). Empty
  #    ({}) by default, which Helm/Strimzi treat as "not set" — Kafka falls
  #    back to its own default authorizer (AllowAll: no ACL enforcement, any
  #    authenticated or anonymous client can do anything). Uncomment
  #    `type: simple` below to turn on the built-in ACL authorizer
  #    (deny-by-default; see .Values.users for granting ACLs). Once you've set
  #    `type`, a later override of `authorization: {}` will NOT clear it —
  #    Helm deep-merges maps, so set `authorization: null` if you need to
  #    remove it again after enabling it.
  authorization: {}
    # type: simple
    # -- Principals that bypass ALL ACL checks. Format depends on how the
    #    principal authenticates:
    #      * mTLS listener  -> "CN=<commonName>" (matches the client cert's CN)
    #      * SCRAM listener -> "<username>" (bare, no prefix)
    #      * anonymous (no `authentication` on the listener) -> "User:ANONYMOUS"
    #    Each entry must map to a real, connecting identity to have any effect.
    # superUsers:
    #   - CN=break-glass-admin   # emergency mTLS admin; bypasses ACLs
    #   - User:ANONYMOUS         # bypasses ACLs for anonymous (no-auth) connections

  # -- Broker configuration (pass-through map -> Kafka.spec.kafka.config).
  #    Cluster-wide defaults; per-topic config overrides where they overlap.
  #    DO NOT set controller.* / process.roles / node.id / metadata.log.dir here
  #    (Strimzi-managed; the chart rejects them).
  config:
    # Durability / replication
    default.replication.factor: 3
    min.insync.replicas: 2
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    auto.create.topics.enable: true
    ## Threading (scale with CPU and JBOD volume count)
    # num.network.threads: 8
    # num.io.threads: 16
    # num.replica.fetchers: 4
    # num.recovery.threads.per.data.dir: 4
    ## Message sizing (keep >= topic max.message.bytes and consumer fetch size)
    # message.max.bytes: 10485760
    # replica.fetch.max.bytes: 10485760
    ## Retention / segments (global defaults)
    # log.retention.hours: 168
    # log.segment.bytes: 1073741824
    # log.retention.check.interval.ms: 300000
    # log.cleaner.enable: true
    ## Throughput / sockets
    # socket.request.max.bytes: 104857600

  # -- Health probes for the Kafka NODES (pass-through -> Kafka.spec.kafka.
  #    livenessProbe / readinessProbe). These are CLUSTER-WIDE: Strimzi applies
  #    them to every Kafka pod (both node pools). KafkaNodePool has no probe
  #    field, so probes cannot be set per-pool.
  #    Allowed keys (Strimzi ProbeSpec): initialDelaySeconds, timeoutSeconds,
  #    periodSeconds, successThreshold, failureThreshold. Empty = Strimzi
  #    defaults (initialDelay 15s, timeout 5s, period 10s, failureThreshold 3).
  #    Raise initialDelaySeconds for large clusters where log recovery on
  #    startup is slow, so slow-but-healthy nodes are not killed mid-recovery.
  livenessProbe: {}
    # initialDelaySeconds: 90   # allow time for on-startup log recovery
    # periodSeconds: 10         # how often to probe
    # timeoutSeconds: 5         # per-attempt timeout
    # failureThreshold: 6       # consecutive FAILURES before the pod is killed
    ## NOTE: successThreshold must be 1 for a liveness probe.
  readinessProbe: {}
    # initialDelaySeconds: 60
    # periodSeconds: 10
    # timeoutSeconds: 5
    # failureThreshold: 6       # consecutive failures before it leaves Endpoints
    # successThreshold: 1       # consecutive SUCCESSES before it is ready again

  # -- Entity Operator (pass-through -> Kafka.spec.entityOperator). Reconciles
  #    KafkaTopic (topicOperator) and KafkaUser (userOperator) CRs. Set to null
  #    (`entityOperator: null`) to disable BOTH — but then .Values.topics/.users
  #    are never reconciled. (`{}` does NOT disable it — Helm keeps the defaults.)
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 1000m
    userOperator:
      resources:
        requests:
          memory: 256Mi
          cpu: 100m
        limits:
          memory: 512Mi
          cpu: 1000m
    ## Optional pass-through template for the Entity Operator pod/containers.
    ## Disabling KafkaTopic finalizers: by default the Topic Operator puts a
    ## `strimzi.io/topic` finalizer on every KafkaTopic, so deleting the CR
    ## blocks until the topic is really gone from Kafka. That can HANG a
    ## `helm uninstall`, because the same release deletes the Topic Operator
    ## that is supposed to clear the finalizer. Setting this to "false" avoids
    ## the hang — at the cost that deleting a KafkaTopic may leave the actual
    ## topic (and its data) behind in Kafka.
    # template:
    #   topicOperatorContainer:
    #     env:
    #       - name: STRIMZI_USE_FINALIZERS
    #         value: "false"

  # -- Kafka Exporter (pass-through -> Kafka.spec.kafkaExporter): consumer-group
  #    lag & offset metrics for Prometheus. Set to null to disable (`{}` won't).
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        memory: 128Mi
        cpu: 100m
      limits:
        memory: 256Mi
        cpu: 250m

  # -- Broker/JVM Prometheus metrics via the JMX Prometheus Exporter.
  metrics:
    # -- Emit a metrics ConfigMap and wire Kafka.spec.kafka.metricsConfig to it.
    enabled: false
    # -- Override the JMX exporter rules (YAML string). Empty = built-in ruleset.
    rules: ""

  # -- Extra pass-through into Kafka.spec.kafka.template (pod labels, image pull
  #    secrets, etc.). Not required.
  kafkaTemplate: {}

# =============================================================================
# Node pools - Broker and Controller as SEPARATE, dedicated pools.
# =============================================================================
nodePools:
  # ---- Controllers: KRaft metadata quorum. Odd replica count (3 recommended). ----
  controller:
    # -- KafkaNodePool name (pod prefix: <cluster>-<name>-<id>).
    name: controller
    # -- Number of controllers. MUST be odd (1, 3, 5). 3 tolerates 1 failure.
    replicas: 3
    # -- Storage (pass-through). Controllers need small, fast, durable disk.
    #    NOTE: for controller-ONLY nodes the disk holds nothing but the KRaft
    #    metadata log, which always lives on a single volume — so JBOD/extra
    #    volumes buy nothing here, and `kraftMetadata: shared` is redundant
    #    (there is only one volume for it to pick).
    storage:
      type: persistent-claim
      size: 50Gi
      # `class` maps to the PVC storageClassName. Use the default one.
      class: ~
      deleteClaim: false
      # kraftMetadata: shared
    # -- Resources
    resources:
      requests:
        memory: 2Gi
        cpu: "500m"
      limits:
        memory: 2Gi
        cpu: "1"
    # -- JVM options (pass-through). Fixed heap avoids resize pauses.
    jvmOptions:
      -Xms: 1024m
      -Xmx: 1024m
      -XX:
        UseG1GC: "true"
        MaxGCPauseMillis: "20"
        InitiatingHeapOccupancyPercent: "35"
    # -- Pod template (pass-through)
    template:
      pod:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: strimzi.io/pool-name
                      operator: In
                      values: [controller]

  # ---- Brokers: data plane. JBOD (multiple volumes) for parallel disk I/O. ----
  broker:
    # -- KafkaNodePool name (pod prefix: <cluster>-<name>-<id>).
    name: broker
    # -- Number of brokers. Must be >= the highest topic replication factor.
    replicas: 3
    # -- Storage (pass-through). JBOD with >= 2 volumes here (each gets its own
    #    PVC). Kafka spreads partition log dirs across the volumes.
    #    KRAFT METADATA: broker nodes also keep a copy of the metadata log, on
    #    ONE volume shared with partition data. By default Strimzi puts it on
    #    the volume with the LOWEST id. Add `kraftMetadata: shared` to pin it to
    #    a specific volume (at most one volume may have it) — e.g. to keep it on
    #    a fast NVMe rather than the lowest-id disk. Changing which volume holds
    #    it triggers a rolling update that deletes and recreates the log, so pin
    #    it explicitly if you plan to add volumes later.
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 50Gi
          # `class` maps to the PVC storageClassName. Use the default one.
          class: ~
          deleteClaim: false
          # kraftMetadata: shared   # redundant while this is the only volume
        ## Second volume for extra partition-data capacity / parallel I/O:
        # - id: 1
        #   type: persistent-claim
        #   size: 50Gi
        #   class: ~
        #   deleteClaim: false
    resources:
      requests:
        memory: 2Gi
        cpu: "1"
      limits:
        memory: 2Gi
        cpu: "2"
    # -- JVM options (pass-through) with G1GC tuning for a low-pause broker.
    jvmOptions:
      -Xms: 1024m
      -Xmx: 1024m
      -XX:
        UseG1GC: "true"
        MaxGCPauseMillis: "20"
        InitiatingHeapOccupancyPercent: "35"
        # G1HeapRegionSize: "16m"
        ExplicitGCInvokesConcurrent: "true"
    # -- Pod template (pass-through). Hard per-node anti-affinity + soft zone spread.
    #    Add nodeAffinity/tolerations here to pin brokers to dedicated hardware.
    template:
      pod:
        affinity:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchExpressions:
                    - key: strimzi.io/pool-name
                      operator: In
                      values: [broker]

# =============================================================================
# Topics -> one KafkaTopic per entry. partitions/replicas + free-form config.
# =============================================================================
topics: []
  ## Example
  # # High-throughput event stream (delete retention).
  # - name: high-throughput-events
  #   partitions: 12
  #   replicas: 3
  #   config:
  #     min.insync.replicas: 2
  #     cleanup.policy: delete
  #     retention.ms: 604800000 # 7 days
  #     retention.bytes: 214748364800 # 200 GiB / partition cap
  #     segment.bytes: 536870912 # 512 MiB
  #     segment.ms: 3600000
  #     compression.type: producer
  #     max.message.bytes: 10485760
  # # Compacted "latest value per key" topic.
  # - name: compacted-state
  #   partitions: 6
  #   replicas: 3
  #   config:
  #     min.insync.replicas: 2
  #     cleanup.policy: compact
  #     min.compaction.lag.ms: 3600000 # 1 hour
  #     max.compaction.lag.ms: 86400000 # 24 hours
  #     delete.retention.ms: 86400000 # 24 hours
  #     min.cleanable.dirty.ratio: "0.3"
  #     segment.bytes: 268435456 # 256 MiB
  #     segment.ms: 3600000

# =============================================================================
# Users -> one KafkaUser per entry. authentication + authorization.acls + quotas
# are passed through verbatim. `authorization.type` should match cluster auth
# (`simple`). Consumers need `Read` on their consumer `group` to commit offsets.
# =============================================================================
users: []
  ## Example
  # # Producer / admin - mutual TLS (identity = certificate CN=producer-admin).
  # - name: producer-admin
  #   authentication:
  #     type: tls
  #   authorization:
  #     type: simple
  #     acls:
  #       - resource:
  #           { type: topic, name: high-throughput-events, patternType: literal }
  #         operations: [Write, Describe]
  #         host: "*"
  #       - resource: { type: topic, name: compacted-state, patternType: literal }
  #         operations: [Write, Describe]
  #         host: "*"
  #       - resource: { type: cluster }
  #         operations: [Describe]
  #         host: "*"
  #   quotas:
  #     producerByteRate: 4194304 # 4 MiB/s
  #     requestPercentage: 55
  # # Consumer — SCRAM-SHA-512 (identity = username analytics-consumer).
  # - name: analytics-consumer
  #   authentication:
  #     type: scram-sha-512
  #   authorization:
  #     type: simple
  #     acls:
  #       - resource:
  #           { type: topic, name: high-throughput-events, patternType: literal }
  #         operations: [Read, Describe]
  #         host: "*"
  #       - resource: { type: topic, name: compacted-state, patternType: literal }
  #         operations: [Read, Describe]
  #         host: "*"
  #       # CRUCIAL: Read on the consumer group so offset commits are allowed.
  #       - resource: { type: group, name: analytics-group, patternType: literal }
  #         operations: [Read]
  #         host: "*"
  #   quotas:
  #     consumerByteRate: 8388608 # 8 MiB/s
  #     requestPercentage: 55
