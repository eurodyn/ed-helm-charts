# =============================================================================
# Example: SCRAM-SHA-512 authentication (username + password).
#   helm install kafka charts/kafka -n kafka --create-namespace \
#     -f charts/kafka/examples/values-auth-scram.yaml
#
# The identity is the KafkaUser NAME. Strimzi's User Operator generates a random
# password and stores it in a Secret named after the user, in the release
# namespace:
#
#   kubectl -n kafka get secret app-client \
#     -o jsonpath='{.data.password}' | base64 -d
#
# Client config (TLS for encryption, SCRAM for identity):
#   bootstrap.servers=scram-kafka-kafka-bootstrap:9093
#   security.protocol=SASL_SSL
#   sasl.mechanism=SCRAM-SHA-512
#   sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule \
#     required username="app-client" password="<from the Secret above>";
#   ssl.truststore.location=/path/to/truststore.jks   # from the cluster CA secret
#
# Easier to distribute than mTLS (no per-client certs), so it's the usual choice
# for external/third-party clients.
# =============================================================================
operator:
  enabled: true

cluster:
  name: scram-kafka

  listeners:
    # TLS encrypts the connection; SCRAM establishes the identity. Do not use
    # tls: false here or passwords cross the network in the clear.
    - name: external
      port: 9093
      type: internal
      tls: true
      authentication:
        type: scram-sha-512

  # Required for the per-user ACLs below.
  authorization:
    type: simple

  # Single broker -> replication factors must be 1.
  config:
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    auto.create.topics.enable: false

nodePools:
  controller:
    replicas: 1
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: true
    resources:
      requests: { memory: 1Gi, cpu: 250m }
      limits: { memory: 1Gi, cpu: "1" }
    jvmOptions:
      -Xms: 512m
      -Xmx: 512m
    template: {}
  broker:
    replicas: 1
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: true
    resources:
      requests: { memory: 2Gi, cpu: 500m }
      limits: { memory: 2Gi, cpu: "2" }
    jvmOptions:
      -Xms: 1024m
      -Xmx: 1024m
    template: {}

topics:
  - name: demo
    partitions: 3
    replicas: 1

users:
  # `authentication.type` MUST match the listener's type (scram-sha-512), or the
  # user has no way to authenticate on that listener.
  - name: app-client
    authentication:
      type: scram-sha-512
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: demo, patternType: literal }
          operations: [Read, Write, Describe]
          host: "*"
        # Consumers MUST have Read on their consumer group to commit offsets.
        - resource: { type: group, name: demo-group, patternType: literal }
          operations: [Read]
          host: "*"
    # Optional per-client rate limits.
    quotas:
      producerByteRate: 1048576
      consumerByteRate: 2097152
