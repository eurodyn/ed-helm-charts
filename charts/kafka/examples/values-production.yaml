# =============================================================================
# Example: production cluster. Real storage classes, resource sizing, locked-down
# external listener, and app-specific topics/users.
#   helm install kafka charts/kafka -n kafka --create-namespace \
#     -f charts/kafka/examples/values-production.yaml
# =============================================================================
operator:
  enabled: true
  watchAnyNamespace: false
  resources:
    requests: { cpu: 200m, memory: 384Mi }
    limits: { cpu: "1", memory: 768Mi }

cluster:
  name: prod-kafka
  version: "4.3.0"
  metadataVersion: "4.3-IV0"

  listeners:
    - name: internal
      port: 9092
      type: internal
      tls: true
      authentication:
        type: tls
    - name: external
      port: 9093
      type: loadbalancer
      tls: true
      authentication:
        type: scram-sha-512
      configuration:
        loadBalancerSourceRanges:
          - 203.0.113.0/24     # <-- replace with your real client CIDR(s)

  authorization:
    type: simple
    superUsers:
      - CN=break-glass-admin   # must map to a real mTLS identity you control

  config:
    default.replication.factor: 3
    min.insync.replicas: 2
    offsets.topic.replication.factor: 3
    transaction.state.log.replication.factor: 3
    transaction.state.log.min.isr: 2
    num.network.threads: 8
    num.io.threads: 16
    message.max.bytes: 10485760
    replica.fetch.max.bytes: 10485760
    log.retention.hours: 168
    auto.create.topics.enable: false

nodePools:
  controller:
    replicas: 3
    storage:
      type: persistent-claim
      size: 50Gi
      class: fast-ssd          # <-- your SSD-backed StorageClass
      deleteClaim: false
    resources:
      requests: { memory: 2Gi, cpu: "1" }
      limits: { memory: 3Gi, cpu: "2" }
  broker:
    replicas: 3
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 500Gi
          class: fast-nvme     # hot volume
          deleteClaim: false
        - id: 1
          type: persistent-claim
          size: 500Gi
          class: standard-ssd  # warm volume
          deleteClaim: false
    resources:
      requests: { memory: 16Gi, cpu: "4" }
      limits: { memory: 16Gi, cpu: "8" }
    # Pin brokers to a dedicated node group (uncomment and label/taint your nodes):
    # template:
    #   pod:
    #     affinity:
    #       nodeAffinity:
    #         requiredDuringSchedulingIgnoredDuringExecution:
    #           nodeSelectorTerms:
    #             - matchExpressions:
    #                 - { key: workload, operator: In, values: [kafka-broker] }
    #     tolerations:
    #       - { key: dedicated, operator: Equal, value: kafka, effect: NoSchedule }

topics:
  - name: orders.events
    partitions: 24
    replicas: 3
    config:
      min.insync.replicas: 2
      retention.ms: 1209600000   # 14 days
      segment.bytes: 1073741824
  - name: orders.state
    partitions: 12
    replicas: 3
    config:
      min.insync.replicas: 2
      cleanup.policy: compact
      min.compaction.lag.ms: 3600000
      delete.retention.ms: 86400000

users:
  - name: orders-producer
    authentication:
      type: tls
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: orders., patternType: prefix }
          operations: [Write, Describe, Create]
          host: "*"
    quotas:
      producerByteRate: 10485760
  - name: orders-consumer
    authentication:
      type: scram-sha-512
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: orders., patternType: prefix }
          operations: [Read, Describe]
          host: "*"
        - resource: { type: group, name: orders-, patternType: prefix }
          operations: [Read]
          host: "*"
    quotas:
      consumerByteRate: 20971520
