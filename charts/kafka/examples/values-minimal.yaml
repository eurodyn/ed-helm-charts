# =============================================================================
# Example: minimal development cluster (single controller + single broker).
#   helm install kafka charts/kafka -n kafka --create-namespace \
#     -f charts/kafka/examples/values-minimal.yaml
# NOT fault-tolerant — for local/dev only.
# =============================================================================
operator:
  enabled: true          # install the Strimzi operator with this release

cluster:
  name: dev-kafka
  # Single external-free setup: one internal listener, SCRAM auth, no LoadBalancer.
  listeners:
    - name: internal
      port: 9092
      type: internal
      tls: true
      authentication:
        type: scram-sha-512
  # Required by the per-user ACLs below (the chart default is {} = no authorizer).
  authorization:
    type: simple
  # Relax durability for a single broker.
  config:
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    auto.create.topics.enable: false

nodePools:
  controller:
    replicas: 1
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: true
      # class: <your-default-sc>   # omit to use the cluster default StorageClass
    resources:
      requests: { memory: 1Gi, cpu: 250m }
      limits: { memory: 1Gi, cpu: "1" }
    jvmOptions:
      -Xms: 512m
      -Xmx: 512m
    template: null        # drop the multi-node anti-affinity for single-node dev (must be `null`, not `{}` — Helm's value merge won't clear a nested default with an empty map)
  broker:
    replicas: 1
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: true
    resources:
      requests: { memory: 2Gi, cpu: 500m }
      limits: { memory: 2Gi, cpu: "2" }
    jvmOptions:
      -Xms: 1024m
      -Xmx: 1024m
    template: null

topics:
  - name: demo
    partitions: 3
    replicas: 1
    config:
      retention.ms: 3600000

users:
  - name: dev-user
    authentication:
      type: scram-sha-512
    authorization:
      type: simple
      acls:
        - resource: { type: topic, name: demo, patternType: literal }
          operations: [Read, Write, Describe]
          host: "*"
        - resource: { type: group, name: dev-group, patternType: prefix }
          operations: [Read]
          host: "*"
