# =============================================================================
# Example: NO AUTHENTICATION (anonymous access). Local/dev only.
#   helm install kafka charts/kafka -n kafka --create-namespace \
#     -f charts/kafka/examples/values-auth-none.yaml
#
# Kafka has TWO independent gates, and this example turns BOTH off:
#   1. AUTHENTICATION ("who are you?") -> the listener's `authentication` block.
#      Omitted below, so any client is accepted without credentials and is
#      given the Kafka principal "User:ANONYMOUS".
#   2. AUTHORIZATION ("what may you do?") -> `cluster.authorization`. Left as {}
#      below, so no ACL authorizer runs and nothing is ever checked.
#
# HOW TO CONNECT — no credentials, no certs, no passwords. Strimzi creates the
# bootstrap Service <cluster.name>-kafka-bootstrap in the release namespace, so
# for this file (installed into namespace `kafka`) it is:
#
#   bootstrap.servers=anon-kafka-kafka-bootstrap.kafka.svc:9092
#   security.protocol=PLAINTEXT
#
# Quick smoke test from inside the cluster:
#   kubectl -n kafka run producer -it --rm --restart=Never \
#     --image=quay.io/strimzi/kafka:latest-kafka-4.3.0 -- \
#     bin/kafka-console-producer.sh \
#       --bootstrap-server anon-kafka-kafka-bootstrap:9092 --topic demo
#
#   kubectl -n kafka run consumer -it --rm --restart=Never \
#     --image=quay.io/strimzi/kafka:latest-kafka-4.3.0 -- \
#     bin/kafka-console-consumer.sh \
#       --bootstrap-server anon-kafka-kafka-bootstrap:9092 --topic demo \
#       --from-beginning
#
# From outside the cluster, port-forward first (reliable here only because this
# example runs a single broker; multi-broker clusters advertise per-broker
# addresses that port-forward cannot resolve — use a nodeport/loadbalancer
# listener instead):
#   kubectl -n kafka port-forward svc/anon-kafka-kafka-bootstrap 9092:9092
#
# WARNING: anyone with network access to the broker has full access. Never
# expose this outside a trusted namespace/network.
# =============================================================================
operator:
  enabled: true

cluster:
  name: anon-kafka

  # No `authentication` key -> anonymous/PLAINTEXT access.
  listeners:
    - name: plain
      port: 9092
      type: internal
      tls: false

  # NOTE: this block is about AUTHORIZATION only — it does not affect whether
  # clients can connect (that is already unrestricted, since the listener above
  # has no `authentication`). It only decides whether their requests are then
  # permitted. Two workable combinations:
  #
  #  A) {} — the chart default, used here. No ACL authorizer runs at all, so
  #     every request is permitted. Simplest, and the right choice when the
  #     anonymous listener is the ONLY listener.
  #
  #  B) `type: simple` + "User:ANONYMOUS" in superUsers. The ACL authorizer runs
  #     but anonymous clients are exempt from it. Choose this when you also have
  #     an authenticated listener whose ACLs you still want enforced:
  #
  #       authorization:
  #         type: simple
  #         superUsers:
  #           - User:ANONYMOUS
  #
  #  Anything else (e.g. `type: simple` with no such superUser) means anonymous
  #  clients still CONNECT fine but every request is denied by the
  #  deny-by-default authorizer. The chart fails the render with an explanatory
  #  message rather than letting you discover that at runtime.
  authorization: {}

  # Single broker -> replication factors must be 1.
  config:
    default.replication.factor: 1
    min.insync.replicas: 1
    offsets.topic.replication.factor: 1
    transaction.state.log.replication.factor: 1
    transaction.state.log.min.isr: 1
    auto.create.topics.enable: false

nodePools:
  controller:
    replicas: 1
    storage:
      type: persistent-claim
      size: 10Gi
      deleteClaim: true
    resources:
      requests: { memory: 1Gi, cpu: 250m }
      limits: { memory: 1Gi, cpu: "1" }
    jvmOptions:
      -Xms: 512m
      -Xmx: 512m
    template: {}
  broker:
    replicas: 1
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 20Gi
          deleteClaim: true
    resources:
      requests: { memory: 2Gi, cpu: 500m }
      limits: { memory: 2Gi, cpu: "2" }
    jvmOptions:
      -Xms: 1024m
      -Xmx: 1024m
    template: {}

topics:
  - name: demo
    partitions: 3
    replicas: 1

# No KafkaUsers: there are no identities to provision for anonymous access.
# (A KafkaUser only makes sense for tls / scram-sha-512 authentication.)
users: []
