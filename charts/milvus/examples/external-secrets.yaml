# =============================================================================
# External Secrets Operator (ESO) example.
#
# These manifests materialise the Kubernetes Secrets that milvus-cluster expects,
# pulling the actual values from your secret manager. They are NOT part of the
# Helm chart — apply them separately (or manage them with your own GitOps), and
# adapt the SecretStore/keys to your environment.
#
# Requires: External Secrets Operator (external-secrets.io/v1) installed, and a
# (Cluster)SecretStore pointing at your backend (Vault / AWS SM / GCP SM / etc).
#
# The store name, backend and remote paths below are FAKE placeholders.
# Replace them. No real credentials appear here.
#
#   kubectl apply -n milvus -f external-secrets.yaml
# =============================================================================
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: milvus-ozone-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-vault-store            # REPLACE
  target:
    name: milvus-ozone-credentials  # consumed by spec.dependencies.storage.secretRef
    creationPolicy: Owner
  data:
    - secretKey: accesskey          # EXACT key expected by the Milvus Operator
      remoteRef:
        key: secret/data/milvus/ozone   # REPLACE
        property: accesskey
    - secretKey: secretkey          # EXACT key expected by the Milvus Operator
      remoteRef:
        key: secret/data/milvus/ozone   # REPLACE
        property: secretkey
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: milvus-ozone-ca
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-vault-store            # REPLACE
  target:
    name: milvus-ozone-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: secret/data/milvus/ozone-ca   # REPLACE
        property: ca.crt
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: milvus-kafka-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-vault-store            # REPLACE
  target:
    name: milvus-kafka-credentials  # projected into pods as KAFKA_SASLUSERNAME/PASSWORD
    creationPolicy: Owner
  data:
    - secretKey: username           # matches externalKafka.usernameKey
      remoteRef:
        key: secret/data/milvus/kafka    # REPLACE
        property: username
    - secretKey: password           # matches externalKafka.passwordKey
      remoteRef:
        key: secret/data/milvus/kafka    # REPLACE
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: milvus-kafka-ca
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-vault-store            # REPLACE
  target:
    name: milvus-kafka-ca
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: secret/data/milvus/kafka-ca   # REPLACE
        property: ca.crt
    # Uncomment for mutual TLS:
    # - secretKey: tls.crt
    #   remoteRef: { key: secret/data/milvus/kafka-client, property: tls.crt }
    # - secretKey: tls.key
    #   remoteRef: { key: secret/data/milvus/kafka-client, property: tls.key }
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: milvus-etcd-credentials
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-vault-store            # REPLACE
  target:
    name: milvus-etcd-credentials   # projected into pods as ETCD_AUTH_USERNAME/PASSWORD
    creationPolicy: Owner
  data:
    - secretKey: username           # matches externalEtcd.usernameKey
      remoteRef:
        key: secret/data/milvus/etcd     # REPLACE
        property: username
    - secretKey: password           # matches externalEtcd.passwordKey
      remoteRef:
        key: secret/data/milvus/etcd     # REPLACE
        property: password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: milvus-etcd-tls
spec:
  refreshInterval: 24h
  secretStoreRef:
    kind: ClusterSecretStore
    name: my-vault-store            # REPLACE
  target:
    name: milvus-etcd-tls
    creationPolicy: Owner
  data:
    - secretKey: ca.crt
      remoteRef:
        key: secret/data/milvus/etcd-tls   # REPLACE
        property: ca.crt
    - secretKey: tls.crt
      remoteRef:
        key: secret/data/milvus/etcd-tls   # REPLACE
        property: tls.crt
    - secretKey: tls.key
      remoteRef:
        key: secret/data/milvus/etcd-tls   # REPLACE
        property: tls.key
