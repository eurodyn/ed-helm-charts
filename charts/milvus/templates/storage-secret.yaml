{{- /*
Optional chart-managed object-storage (Ozone S3) credential Secret.
Created ONLY when externalStorage.credentials.create is true. Uses the EXACT
key names the Milvus Operator expects for storage.secretRef: accesskey / secretkey.

SECURITY: Enabling this places the access/secret key into the Helm release data
stored in the cluster (and into any values file it was rendered from). This is
NOT suitable for Git-based/GitOps workflows unless the values are encrypted
(SOPS, Sealed Secrets, External Secrets Operator, Vault, Argo CD Vault Plugin).
Prefer externalStorage.existingSecret in production.
*/ -}}
{{- if .Values.externalStorage.credentials.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "milvus-cluster.storageSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milvus-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: storage-credentials
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- include "milvus-cluster.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  accesskey: {{ .Values.externalStorage.credentials.accessKey | quote }}
  secretkey: {{ .Values.externalStorage.credentials.secretKey | quote }}
{{- end -}}
