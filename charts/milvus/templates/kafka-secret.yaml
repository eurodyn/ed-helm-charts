{{- /*
Optional chart-managed Kafka SASL credential Secret.
Created ONLY when externalKafka.credentials.create is true. The keys are named
after externalKafka.usernameKey / passwordKey so the same env projection works
for both chart-created and pre-existing Secrets. These credentials are consumed
by projecting them into the Milvus pods as environment variables
(KAFKA_SASLUSERNAME / KAFKA_SASLPASSWORD) — see templates/milvus.yaml. They are
never written into the Milvus custom resource as plaintext.

SECURITY: Enabling this stores the SASL username/password in Helm release data.
Not suitable for Git unless encrypted. Prefer externalKafka.existingSecret in
production (populated by ESO/Vault/SOPS/Sealed Secrets).
*/ -}}
{{- if .Values.externalKafka.credentials.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "milvus-cluster.kafkaSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milvus-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: kafka-credentials
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- include "milvus-cluster.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.externalKafka.usernameKey | default "username" }}: {{ include "milvus-cluster.tplvalues.render" (dict "value" .Values.externalKafka.credentials.username "context" $) | quote }}
  {{ .Values.externalKafka.passwordKey | default "password" }}: {{ include "milvus-cluster.tplvalues.render" (dict "value" .Values.externalKafka.credentials.password "context" $) | quote }}
{{- end -}}
