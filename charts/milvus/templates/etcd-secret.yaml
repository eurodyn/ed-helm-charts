{{- /*
Optional chart-managed etcd authentication credential Secret.
Created ONLY when externalEtcd.authentication.createSecret is true. Keys are named
after externalEtcd.usernameKey / passwordKey. Consumed via env projection into the
Milvus pods (ETCD_AUTH_USERNAME / ETCD_AUTH_PASSWORD) — never written into the
Milvus custom resource as plaintext.

SECURITY: Enabling this stores the etcd username/password in Helm release data.
Not suitable for Git unless encrypted. Prefer externalEtcd.existingSecret in
production.
*/ -}}
{{- if and .Values.externalEtcd.authentication.enabled .Values.externalEtcd.authentication.createSecret -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "milvus-cluster.etcdSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "milvus-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: etcd-credentials
  {{- with .Values.extraAnnotations }}
  annotations:
    {{- include "milvus-cluster.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  {{ .Values.externalEtcd.usernameKey | default "username" }}: {{ include "milvus-cluster.tplvalues.render" (dict "value" .Values.externalEtcd.authentication.username "context" $) | quote }}
  {{ .Values.externalEtcd.passwordKey | default "password" }}: {{ include "milvus-cluster.tplvalues.render" (dict "value" .Values.externalEtcd.authentication.password "context" $) | quote }}
{{- end -}}
