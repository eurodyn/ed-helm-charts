apiVersion: v2
name: milvus-cluster
description: >-
  Production-grade Helm chart that deploys a Milvus 2.6 cluster through the
  Milvus Operator by creating a milvus.io/v1beta1 Milvus custom resource.
  This chart connects Milvus exclusively to pre-existing EXTERNAL Kafka, etcd
  and Apache Ozone (S3 Gateway) dependencies. It never installs, manages or
  deletes those external systems.
type: application

# Chart version. Bump on every change to chart templates/values.
version: 0.1.2

# The Milvus server image version this chart targets and was validated against.
# See values.yaml image.tag and README "Supported Milvus version".
appVersion: "v2.6.20"

kubeVersion: ">=1.24.0-0"

icon: https://raw.githubusercontent.com/eurodyn/ed-helm-charts/main/logo_ed.png

keywords:
  - milvus
  - milvus-operator
  - vector-database
  - milvus-cluster
  - kafka
  - etcd
  - s3
  - apache-ozone
  - streaming

home: https://milvus.io
sources:
  - https://github.com/milvus-io/milvus
  - https://github.com/zilliztech/milvus-operator

maintainers:
  - name: European Dynamics SA
    url: https://www.eurodyn.com
    email: info@eurodyn.com

annotations:
  # This chart only renders a Milvus custom resource; the Milvus Operator must
  # already be installed and running in the cluster to reconcile it.
  milvus.io/requires-operator: "true"
  milvus.io/operator-min-version: "1.3.7"
  category: Database
  licenses: Apache-2.0

# NOTE: This chart intentionally declares NO dependencies. Kafka, etcd,
# Apache Ozone, MinIO, Pulsar, BookKeeper, ZooKeeper and Woodpecker are all
# external, pre-existing services. There is deliberately no Chart.lock.
